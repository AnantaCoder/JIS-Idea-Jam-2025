<!DOCTYPE html>
<html>
<head>
    <title>Crop Yield Prediction</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        
        form {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            transition: all 0.3s ease;
        }
        
        form:hover {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }
        
        label {
            display: block;
            margin: 15px 0 5px;
            color: #34495e;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: scale(1.02);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        h2 {
            color: #27ae60;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #eafaf1;
            border-radius: 5px;
        }
        
        @media (max-width: 600px) {
            form {
                padding: 20px;
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <h1>Crop Yield Prediction</h1>
    <form method="post">
        {% csrf_token %}
        <label for="Crop_Year">Crop Year:</label>
        <input type="text" name="Crop_Year" required><br>

        <label for="Area">Area:</label>
        <input type="text" name="Area" required><br>

        <label for="Production">Production:</label>
        <input type="text" name="Production" required><br>

        <label for="Annual_Rainfall">Annual Rainfall:</label>
        <input type="text" name="Annual_Rainfall" required><br>

        <label for="Fertilizer">Fertilizer:</label>
        <input type="text" name="Fertilizer" required><br>

        <label for="Pesticide">Pesticide:</label>
        <input type="text" name="Pesticide" required><br>

        <label for="Crop">Crop:</label>
        <input type="text" name="Crop" required><br>

        <label for="Season">Season:</label>
        <input type="text" name="Season" required><br>

        <label for="State">State:</label>
        <input type="text" name="State" required><br>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
