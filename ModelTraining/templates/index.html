<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #prediction-result {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Crop Prediction</h1>
    
    <form id="prediction-form">
        <label for="N">Nitrogen (N):</label>
        <input type="number" id="N" name="N" required><br><br>
        
        <label for="P">Phosphorus (P):</label>
        <input type="number" id="P" name="P" required><br><br>
        
        <label for="K">Potassium (K):</label>
        <input type="number" id="K" name="K" required><br><br>
        
        <label for="temperature">Temperature (°C):</label>
        <input type="number" id="temperature" name="temperature" step="0.1" required><br><br>
        
        <label for="humidity">Humidity (%):</label>
        <input type="number" id="humidity" name="humidity" required><br><br>
        
        <label for="ph">pH level:</label>
        <input type="number" id="ph" name="ph" step="0.1" required><br><br>
        
        <label for="rainfall">Rainfall (mm):</label>
        <input type="number" id="rainfall" name="rainfall" required><br><br>
        
        <button type="submit">Predict Crop</button>
    </form>

    <h2>Predicted Crop:</h2>
    <p id="prediction-result"></p>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', function(e) {
            e.preventDefault();  

            var formData = {
                N: document.getElementById('N').value,
                P: document.getElementById('P').value,
                K: document.getElementById('K').value,
                temperature: document.getElementById('temperature').value,
                humidity: document.getElementById('humidity').value,
                ph: document.getElementById('ph').value,
                rainfall: document.getElementById('rainfall').value
            };

            fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())  
            .then(data => {
                if (data.error) {
                    document.getElementById('prediction-result').innerText = "Error: " + data.error;
                } else {
                    document.getElementById('prediction-result').innerText = data.predicted_crop;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('prediction-result').innerText = "An error occurred. Please try again.";
            });
        });
    </script>
</body>
</html>
