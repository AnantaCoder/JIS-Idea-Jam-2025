<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        h2 {
            text-align: center;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            margin: 10px 0;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 200px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .prediction {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Crop Prediction Based on Soil and Weather Conditions</h2>

    <div class="form-container">
        <form method="POST" action="/predict">
            <label for="N">Nitrogen (N)</label>
            <input type="text" id="N" name="N" required>

            <label for="P">Phosphorus (P)</label>
            <input type="text" id="P" name="P" required>

            <label for="K">Potassium (K)</label>
            <input type="text" id="K" name="K" required>

            <label for="temperature">Temperature (°C)</label>
            <input type="text" id="temperature" name="temperature" required>

            <label for="humidity">Humidity (%)</label>
            <input type="text" id="humidity" name="humidity" required>

            <label for="ph">pH Level</label>
            <input type="text" id="ph" name="ph" required>

            <label for="rainfall">Rainfall (mm)</label>
            <input type="text" id="rainfall" name="rainfall" required>

            <button type="submit">Predict Crop</button>
        </form>

        {% if prediction_text %}
        <div class="prediction">{{ prediction_text }}</div>
        {% endif %}
    </div>

</body>
</html>
