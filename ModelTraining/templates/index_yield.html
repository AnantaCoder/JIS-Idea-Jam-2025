<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #2f4f4f;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 1.2em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .result {
            text-align: center;
            margin-top: 30px;
            font-size: 1.2em;
            padding: 10px;
            background-color: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            color: #388e3c;
        }
        .error {
            text-align: center;
            margin-top: 30px;
            font-size: 1.2em;
            padding: 10px;
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 5px;
            color: #d32f2f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Crop Yield Prediction</h1>

    <form method="POST" action="/predict">
        <div class="form-group">
            <label for="Crop_Year">Crop Year</label>
            <input type="number" id="Crop_Year" name="Crop_Year" required>
        </div>

        <div class="form-group">
            <label for="Area">Area (in hectares)</label>
            <input type="number" id="Area" name="Area" step="any" required>
        </div>

        <div class="form-group">
            <label for="Production">Production (in tons)</label>
            <input type="number" id="Production" name="Production" step="any" required>
        </div>

        <div class="form-group">
            <label for="Annual_Rainfall">Annual Rainfall (mm)</label>
            <input type="number" id="Annual_Rainfall" name="Annual_Rainfall" step="any" required>
        </div>

        <div class="form-group">
            <label for="Fertilizer">Fertilizer (kg)</label>
            <input type="number" id="Fertilizer" name="Fertilizer" step="any" required>
        </div>

        <div class="form-group">
            <label for="Pesticide">Pesticide (kg)</label>
            <input type="number" id="Pesticide" name="Pesticide" step="any" required>
        </div>

        <div class="form-group">
            <label for="Crop">Crop</label>
            <input type="text" id="Crop" name="Crop" required>
        </div>

        <div class="form-group">
            <label for="Season">Season</label>
            <select id="Season" name="Season">
                <option value="Whole Year">Whole Year</option>
                <option value="Kharif">Kharif</option>
                <option value="Rabi">Rabi</option>
                <option value="Autumn">Autumn</option>
                <option value="Summer">Summer</option>
                <option value="Winter">Winter</option>
            </select>
        </div>

        <div class="form-group">
            <label for="State">State</label>
            <input type="text" id="State" name="State" required>
        </div>

        <button type="submit" class="btn">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
        <p><strong>Predicted Crop Yield:</strong> {{ prediction }} tons</p>
    </div>
    {% elif error %}
    <div class="error">
        <p><strong>Error:</strong> {{ error }}</p>
    </div>
    {% endif %}
</div>

</body>
</html>
